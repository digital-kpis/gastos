<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0e0f11; --surface:#16181c; --surface2:#1e2128; --border:#2a2d35;
  --entrada:#22c55e; --saida:#ef4444; --warn:#f59e0b;
  --text:#f1f5f9; --muted:#64748b; --accent:#6ee7b7;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 20px 14px;position:sticky;top:0;z-index:200;}
header h1{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--accent);letter-spacing:-.02em;}
header p{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:2px;}

/* MONTH TABS */
.month-tabs-wrap{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:68px;z-index:150;}
.month-tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:10px 16px;gap:6px;}
.month-tabs::-webkit-scrollbar{display:none;}
.mtab{flex-shrink:0;padding:7px 14px;border-radius:99px;font-family:'DM Mono',monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .2s;white-space:nowrap;}
.mtab.active{background:var(--accent);color:#0e0f11;border-color:var(--accent);font-weight:500;}
.mtab.has-data{border-color:#2a4a3e;color:var(--accent);}
.mtab.active.has-data{background:var(--accent);color:#0e0f11;}

/* INNER TABS */
.inner-tabs-wrap{max-width:520px;margin:0 auto;padding:14px 16px 0;}
.inner-tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:10px;border:1px solid var(--border);}
.itab{flex:1;text-align:center;padding:8px;border-radius:7px;font-size:.67rem;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;color:var(--muted);transition:all .2s;border:none;background:transparent;font-family:'DM Mono',monospace;}
.itab.active{background:var(--surface);color:var(--accent);border:1px solid var(--border);}

/* MAIN */
main{padding:16px 16px 60px;display:flex;flex-direction:column;gap:16px;max-width:520px;margin:0 auto;}
.ipanel{display:none;flex-direction:column;gap:16px;}
.ipanel.active{display:flex;}

/* SECTION LABEL */
.slabel{font-size:.62rem;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);padding:0 2px;margin-bottom:-6px;}

/* LOTE HEADER */
.lote-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.lote-title{font-family:'DM Serif Display',serif;font-size:.95rem;}
.lote-badge{font-size:.6rem;color:var(--muted);background:var(--surface2);padding:4px 9px;border-radius:99px;border:1px solid var(--border);}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;animation:fadeUp .35s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* PILLS */
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.pill{background:var(--surface2);border-radius:10px;padding:11px 13px;border:1px solid var(--border);}
.pill-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:5px;}
.pill-value{font-size:1rem;font-family:'DM Serif Display',serif;}
.pill-value.e{color:var(--entrada);}
.pill-value.s{color:var(--saida);}

/* SALDO ROW */
.saldo-row{background:var(--surface2);border-radius:10px;padding:12px 14px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.saldo-row span:first-child{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
.saldo-val{font-family:'DM Serif Display',serif;font-size:1.1rem;}
.saldo-val.pos{color:var(--entrada);}
.saldo-val.neg{color:var(--saida);}

/* PROGRESS */
.prog-wrap{margin-top:12px;}
.prog-label{display:flex;justify-content:space-between;font-size:.6rem;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.1em;}
.prog-track{height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1);}
.prog-fill.d{background:var(--saida);}
.prog-fill.w{background:var(--warn);}
.prog-fill.o{background:var(--entrada);}

/* DESPESA ITEM */
.ilist{display:flex;flex-direction:column;gap:6px;}

.iitem{
  background:var(--surface2);border-radius:10px;border:1px solid var(--border);
  overflow:hidden;transition:border-color .2s;
}
.iitem:hover{border-color:#3a4050;}
.iitem-main{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;}
.iitem-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot.pago{background:var(--entrada);}
.dot.pendente{background:var(--warn);}
.dot.atrasado{background:var(--saida);}
.iname{font-size:.78rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.itag{font-size:.57rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;}
.iitem-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px;}
.ival{font-size:.82rem;font-weight:500;}
.ival.saida{color:var(--saida);}
.ival.entrada{color:var(--entrada);}
.ival.pago-ok{color:var(--muted);text-decoration:line-through;}

/* ACTION BUTTONS */
.act-btns{display:flex;gap:4px;}
.act-btn{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  border-radius:6px;padding:4px 7px;font-size:.62rem;cursor:pointer;
  font-family:'DM Mono',monospace;transition:all .15s;white-space:nowrap;
}
.act-btn:hover{border-color:var(--accent);color:var(--accent);}
.act-btn.edit:hover{border-color:#818cf8;color:#818cf8;}
.act-btn.copy:hover{border-color:var(--warn);color:var(--warn);}
.act-btn.del:hover{border-color:var(--saida);color:var(--saida);}

/* OBS ROW */
.obs-row{
  padding:0 12px;max-height:0;overflow:hidden;
  transition:max-height .3s ease,padding .3s ease;
  border-top:0px solid var(--border);
}
.obs-row.open{max-height:80px;padding:8px 12px;border-top:1px solid var(--border);}
.obs-text{font-size:.7rem;color:var(--muted);font-style:italic;line-height:1.5;}
.obs-empty{font-size:.68rem;color:#3a4050;font-style:italic;}

/* FORM */
.fgrid{display:flex;flex-direction:column;gap:11px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fgroup{display:flex;flex-direction:column;gap:5px;}
.fgroup.full{grid-column:1/-1;}
label{font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);}
input,select,textarea{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;
  font-size:.8rem;padding:9px 11px;outline:none;transition:border-color .2s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:var(--surface2);}
textarea{resize:vertical;min-height:60px;}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:10px;border:none;font-family:'DM Mono',monospace;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;transition:all .2s;}
.btn-primary{background:var(--accent);color:#0e0f11;font-weight:500;}
.btn-primary:hover{opacity:.85;transform:translateY(-1px);}
.btn-secondary{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:#000000bb;z-index:500;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px 18px 0 0;padding:22px 20px 32px;
  width:100%;max-width:520px;
  transform:translateY(40px);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-title{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--accent);margin-bottom:18px;}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 18px;}

/* COPY MONTH PICKER */
.month-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.mpick{
  padding:6px 12px;border-radius:99px;font-size:.65rem;text-transform:uppercase;
  letter-spacing:.08em;cursor:pointer;border:1px solid var(--border);
  background:var(--surface2);color:var(--muted);transition:all .15s;
  font-family:'DM Mono',monospace;
}
.mpick:hover{border-color:var(--warn);color:var(--warn);}
.mpick.picked{background:var(--warn);color:#0e0f11;border-color:var(--warn);font-weight:500;}

/* CHART */
.chart-wrap{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;}
.bar{width:100%;border-radius:4px 4px 0 0;transition:height .8s cubic-bezier(.4,0,.2,1);}
.bar-lbl{font-size:.52rem;color:var(--muted);text-align:center;}

/* SALDO GERAL */
.card-geral{background:linear-gradient(135deg,#14532d18,#0e0f11);border-color:#22c55e2a;}

/* EMPTY */
.empty{text-align:center;padding:24px 16px;color:var(--muted);font-size:.72rem;}
.empty-icon{font-size:1.6rem;margin-bottom:7px;}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:4px 0;}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--accent);color:#0e0f11;padding:9px 20px;border-radius:99px;font-size:.72rem;font-weight:500;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:999;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <h1>Controle Financeiro</h1>
  <p>2026 · Saldos independentes por mês</p>
</header>

<div class="month-tabs-wrap">
  <div class="month-tabs" id="month-tabs"></div>
</div>

<div class="inner-tabs-wrap">
  <div class="inner-tabs">
    <button class="itab active" onclick="switchInner('resumo',this)">Resumo</button>
    <button class="itab" onclick="switchInner('lancamentos',this)">Lançamentos</button>
    <button class="itab" onclick="switchInner('grafico',this)">Gráfico</button>
  </div>
</div>

<main>

  <!-- RESUMO -->
  <div class="ipanel active" id="ipanel-resumo">
    <div id="resumo-content"></div>
  </div>

  <!-- LANÇAMENTOS -->
  <div class="ipanel" id="ipanel-lancamentos">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span style="font-family:'DM Serif Display',serif;font-size:.95rem">Novo Lançamento</span>
        <span id="form-mes-label" style="font-size:.62rem;color:var(--accent);background:var(--surface2);padding:4px 9px;border-radius:99px;border:1px solid var(--border)"></span>
      </div>
      <div class="fgrid">
        <div class="frow">
          <div class="fgroup">
            <label>Tipo</label>
            <select id="f-tipo"><option value="saida">Despesa</option><option value="entrada">Receita</option></select>
          </div>
          <div class="fgroup">
            <label>Lote</label>
            <select id="f-lote"><option value="1">Adiantamento</option><option value="2">Pagamento</option></select>
          </div>
        </div>
        <div class="fgroup full">
          <label>Descrição</label>
          <input type="text" id="f-desc" placeholder="ex: aluguel, conta celular…">
        </div>
        <div class="frow">
          <div class="fgroup">
            <label>Valor (R$)</label>
            <input type="number" id="f-valor" placeholder="0,00" step="0.01" min="0">
          </div>
          <div class="fgroup">
            <label>Status</label>
            <select id="f-status"><option value="pendente">Pendente</option><option value="pago">Pago</option><option value="atrasado">Atrasado</option></select>
          </div>
        </div>
        <div class="fgroup full">
          <label>Observação (opcional)</label>
          <textarea id="f-obs" placeholder="Alguma nota sobre este lançamento…"></textarea>
        </div>
        <button class="btn btn-primary" onclick="addItem()">＋ Adicionar</button>
      </div>
    </div>
    <p class="slabel">Histórico do mês</p>
    <div class="card">
      <div class="ilist" id="historico-list"></div>
    </div>
  </div>

  <!-- GRÁFICO -->
  <div class="ipanel" id="ipanel-grafico">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span style="font-family:'DM Serif Display',serif;font-size:.95rem">Entrada vs Saída</span>
        <span id="chart-mes-label" style="font-size:.62rem;color:var(--muted);background:var(--surface2);padding:4px 9px;border-radius:99px;border:1px solid var(--border)"></span>
      </div>
      <div class="chart-wrap" id="chart-bars"></div>
      <div style="display:flex;gap:14px;margin-top:10px">
        <span style="font-size:.6rem;color:var(--entrada)">■ Entrada</span>
        <span style="font-size:.6rem;color:var(--saida)">■ Saída</span>
      </div>
    </div>
    <div class="card">
      <div style="margin-bottom:12px;font-family:'DM Serif Display',serif;font-size:.95rem">Maiores Despesas</div>
      <div id="top-list"></div>
    </div>
  </div>

</main>

<!-- ═══ MODAL EDIT ═══ -->
<div class="modal-overlay" id="modal-edit" onclick="closeModal('modal-edit',event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Editar Lançamento</div>
    <input type="hidden" id="edit-id">
    <div class="fgrid">
      <div class="frow">
        <div class="fgroup">
          <label>Tipo</label>
          <select id="edit-tipo"><option value="saida">Despesa</option><option value="entrada">Receita</option></select>
        </div>
        <div class="fgroup">
          <label>Status</label>
          <select id="edit-status"><option value="pendente">Pendente</option><option value="pago">Pago</option><option value="atrasado">Atrasado</option></select>
        </div>
      </div>
      <div class="fgroup full">
        <label>Descrição</label>
        <input type="text" id="edit-desc">
      </div>
      <div class="fgroup full">
        <label>Valor (R$)</label>
        <input type="number" id="edit-valor" step="0.01" min="0">
      </div>
      <div class="fgroup full">
        <label>Observação</label>
        <textarea id="edit-obs" placeholder="Alguma nota…"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeModal('modal-edit')">Cancelar</button>
        <button class="btn btn-primary" onclick="saveEdit()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ MODAL COPY ═══ -->
<div class="modal-overlay" id="modal-copy" onclick="closeModal('modal-copy',event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Copiar para outro mês</div>
    <input type="hidden" id="copy-id">

    <!-- Editable fields -->
    <div class="fgrid" style="margin-bottom:14px">
      <div class="fgroup full">
        <label>Descrição (editável)</label>
        <input type="text" id="copy-desc" placeholder="Altere se necessário">
      </div>
      <div class="frow">
        <div class="fgroup">
          <label>Valor (R$)</label>
          <input type="number" id="copy-valor" step="0.01" min="0" placeholder="0,00">
        </div>
        <div class="fgroup">
          <label>Status</label>
          <select id="copy-status">
            <option value="pendente">Pendente</option>
            <option value="pago">Pago</option>
            <option value="atrasado">Atrasado</option>
          </select>
        </div>
      </div>
      <div class="fgroup full">
        <label>Observação</label>
        <textarea id="copy-obs" placeholder="Alguma nota…" style="min-height:48px"></textarea>
      </div>
    </div>

    <div style="height:1px;background:var(--border);margin-bottom:14px"></div>

    <div class="fgroup" style="margin-bottom:14px">
      <label>Mês destino</label>
      <div class="month-picker" id="month-picker"></div>
    </div>
    <div class="fgroup" style="margin-bottom:16px">
      <label>Lote destino</label>
      <select id="copy-lote"><option value="1">Adiantamento</option><option value="2">Pagamento</option></select>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('modal-copy')">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmCopy()" style="background:var(--warn);color:#0e0f11">📋 Copiar</button>
    </div>
  </div>
</div>

<!-- ═══ MODAL DATE EDIT ═══ -->
<div class="modal-overlay" id="modal-date" onclick="closeModal('modal-date',event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="date-modal-title">Data de Pagamento</div>
    <input type="hidden" id="date-lote-key">
    <div class="fgrid">
      <div class="fgroup full">
        <label>Data prevista de pagamento</label>
        <input type="date" id="date-input">
      </div>
      <div id="date-preview" style="background:var(--surface2);border-radius:10px;padding:12px;border:1px solid var(--border);font-size:.75rem;color:var(--muted);text-align:center;display:none;"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeModal('modal-date')">Cancelar</button>
        <button class="btn btn-primary" onclick="saveDate()">💾 Salvar</button>
      </div>
      <button class="btn btn-secondary" style="border-color:var(--saida);color:var(--saida)" onclick="clearDate()">🗑 Remover data</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════
const MONTHS = [
  {key:'jan',label:'Jan'},{key:'fev',label:'Fev'},{key:'mar',label:'Mar'},
  {key:'abr',label:'Abr'},{key:'mai',label:'Mai'},{key:'jun',label:'Jun'},
  {key:'jul',label:'Jul'},{key:'ago',label:'Ago'},{key:'set',label:'Set'},
  {key:'out',label:'Out'},{key:'nov',label:'Nov'},{key:'dez',label:'Dez'},
];
const MNAMES = {
  jan:'Janeiro',fev:'Fevereiro',mar:'Março',abr:'Abril',
  mai:'Maio',jun:'Junho',jul:'Julho',ago:'Agosto',
  set:'Setembro',out:'Outubro',nov:'Novembro',dez:'Dezembro'
};

// ══════════════════════════════════════════
//  DB  (completely isolated per month)
// ══════════════════════════════════════════
const DB = {
  jun:{
    lote1:[
      {id:1,tipo:'entrada',desc:'Adiantamento',valor:1144.14,status:'pago',obs:''},
      {id:2,tipo:'saida',  desc:'Aluguel',      valor:700.00, status:'pago',obs:''},
      {id:3,tipo:'saida',  desc:'Pensão',        valor:432.00, status:'pago',obs:''},
    ],
    lote2:[
      {id:4, tipo:'entrada',desc:'Pagamento',    valor:747.78, status:'pago',    obs:''},
      {id:5, tipo:'saida',  desc:'Celular 10/10',valor:259.90, status:'pago',    obs:''},
      {id:6, tipo:'saida',  desc:'Obramax 3-6',  valor:113.00, status:'pago',    obs:''},
      {id:7, tipo:'saida',  desc:'Mãe 6-12',     valor:144.00, status:'pago',    obs:''},
      {id:8, tipo:'saida',  desc:'Conta Celular', valor:110.00, status:'pago',   obs:''},
      {id:9, tipo:'saida',  desc:'Pavunense 3-5', valor:97.44,  status:'pendente',obs:''},
      {id:10,tipo:'saida',  desc:'Shopii 3-5',    valor:50.47,  status:'pago',   obs:''},
      {id:11,tipo:'saida',  desc:'Passagem 3-6',  valor:33.54,  status:'pago',   obs:''},
      {id:12,tipo:'saida',  desc:'Carrinho 3-10', valor:82.00,  status:'pago',   obs:''},
      {id:13,tipo:'saida',  desc:'Obramax 1/7',   valor:50.00,  status:'pago',   obs:''},
    ]
  }
};
// Dates per month per lote — editable
const LOTE_DATES = {};
MONTHS.forEach(m=>{
  if(!DB[m.key]) DB[m.key]={lote1:[],lote2:[]};
  LOTE_DATES[m.key] = { lote1:'', lote2:'' };
});
// Pre-fill june defaults
LOTE_DATES['jun'] = { lote1:'20/06/2026', lote2:'05/07/2026' };

let nextId = 200;
let currentMonth = 'jun';
let currentInner = 'resumo';

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
const fmt = v => 'R$ ' + Math.abs(v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const calcLote = items => {
  const e = items.filter(i=>i.tipo==='entrada').reduce((s,i)=>s+i.valor,0);
  const s = items.filter(i=>i.tipo==='saida').reduce((s,i)=>s+i.valor,0);
  return {entrada:e,saida:s,saldo:e-s};
};
const monthData = () => DB[currentMonth];
const hasData   = k => DB[k].lote1.length>0 || DB[k].lote2.length>0;
const findItem  = id => {
  const d = monthData();
  return d.lote1.find(i=>i.id===id) || d.lote2.find(i=>i.id===id);
};

// ══════════════════════════════════════════
//  MONTH TABS
// ══════════════════════════════════════════
function renderMonthTabs() {
  document.getElementById('month-tabs').innerHTML = MONTHS.map(m=>`
    <button class="mtab ${m.key===currentMonth?'active':''} ${hasData(m.key)?'has-data':''}"
            onclick="switchMonth('${m.key}')">${m.label}</button>`).join('');
}

// ══════════════════════════════════════════
//  RENDER RESUMO — two separate lote sections
// ══════════════════════════════════════════
function renderResumo() {
  const d  = monthData();
  const mn = MNAMES[currentMonth];
  const isEmpty = d.lote1.length===0 && d.lote2.length===0;

  if (isEmpty) {
    document.getElementById('resumo-content').innerHTML = `
      <div class="card">
        <div class="empty">
          <div class="empty-icon">📅</div>
          Nenhum dado em ${mn}<br>
          <span style="font-size:.65rem;color:var(--accent);margin-top:6px;display:inline-block">
            Use a aba Lançamentos para adicionar
          </span>
        </div>
      </div>`;
    return;
  }

  const l1 = calcLote(d.lote1);
  const l2 = calcLote(d.lote2);

  let html = '';

  // ── ADIANTAMENTO ──
  html += buildLoteSection('Adiantamento', LOTE_DATES[currentMonth].lote1, d.lote1, l1, 'lote1');

  // ── PAGAMENTO ──
  html += buildLoteSection('Pagamento', LOTE_DATES[currentMonth].lote2, d.lote2, l2, 'lote2');

  // ── SALDO DO MÊS ──
  const totalE = l1.entrada + l2.entrada;
  const totalS = l1.saida   + l2.saida;
  const totalSaldo = totalE - totalS;
  const sc = totalSaldo>=0?'pos':'neg';
  const ss = totalSaldo>=0?'+ ':'− ';
  html += `
    <div class="card card-geral">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-family:'DM Serif Display',serif;font-size:.95rem;color:var(--accent)">Saldo do Mês</span>
        <span style="font-size:.62rem;color:var(--muted);background:var(--surface2);padding:4px 9px;border-radius:99px;border:1px solid var(--border)">${mn} 2026</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em">Total Entradas</span>
        <span style="color:var(--entrada);font-size:.82rem">${fmt(totalE)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:14px">
        <span style="font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em">Total Saídas</span>
        <span style="color:var(--saida);font-size:.82rem">${fmt(totalS)}</span>
      </div>
      <div class="saldo-row" style="background:var(--bg)">
        <span>Saldo Final · ${mn}</span>
        <span class="saldo-val ${sc}">${ss}${fmt(totalSaldo)}</span>
      </div>
      <p style="font-size:.58rem;color:var(--muted);margin-top:10px;text-align:center;letter-spacing:.08em">✦ Este saldo não afeta outros meses</p>
    </div>`;

  document.getElementById('resumo-content').innerHTML = html;
}

function buildLoteSection(title, dateStr, items, lCalc, loteKey) {
  const mn = MNAMES[currentMonth];
  const s  = lCalc.saldo;
  const sc = s>=0?'pos':'neg';
  const ss = s>=0?'+ ':'− ';
  const pct  = lCalc.entrada>0 ? Math.round(lCalc.saida/lCalc.entrada*100) : 0;
  const pctC = pct>90?'d':pct>70?'w':'o';
  const pctW = Math.min(pct,100);
  const dateLabel = dateStr || 'Sem data';
  const dateColor = dateStr ? 'var(--accent)' : 'var(--warn)';

  // Separate entries from expenses
  const entradas = items.filter(i=>i.tipo==='entrada');
  const saidas   = items.filter(i=>i.tipo==='saida');

  let html = `
    <div class="card">
      <div class="lote-header">
        <span class="lote-title">${title}</span>
        <button class="lote-date-btn" onclick="openDateEdit('${loteKey}')" title="Editar data de pagamento"
          style="font-size:.6rem;color:${dateColor};background:var(--surface2);padding:5px 10px;border-radius:99px;border:1px solid var(--border);cursor:pointer;font-family:'DM Mono',monospace;display:flex;align-items:center;gap:5px;transition:all .2s;"
          onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
          📅 ${escHtml(dateLabel)}
        </button>
      </div>
      <div class="pills">
        <div class="pill"><div class="pill-label">Entrada</div><div class="pill-value e">${fmt(lCalc.entrada)}</div></div>
        <div class="pill"><div class="pill-label">Saída</div><div class="pill-value s">${fmt(lCalc.saida)}</div></div>
      </div>
      <div class="saldo-row">
        <span>Saldo ${title}</span>
        <span class="saldo-val ${sc}">${ss}${fmt(s)}</span>
      </div>
      <div class="prog-wrap">
        <div class="prog-label"><span>Comprometido</span><span>${pct}%</span></div>
        <div class="prog-track"><div class="prog-fill ${pctC}" style="width:${pctW}%"></div></div>
      </div>`;

  // ── Entradas ──
  if (entradas.length) {
    html += `<div style="margin-top:14px;margin-bottom:6px;font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;color:var(--entrada)">▲ Receitas</div>`;
    html += `<div class="ilist">` + entradas.map(i => buildItemRow(i, loteKey)).join('') + `</div>`;
  }

  // ── Saídas ──
  if (saidas.length) {
    html += `<div style="margin-top:12px;margin-bottom:6px;font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;color:var(--saida)">▼ Despesas</div>`;
    html += `<div class="ilist">` + saidas.map(i => buildItemRow(i, loteKey)).join('') + `</div>`;
  }

  html += `</div>`;
  return html;
}

function buildItemRow(i, loteKey) {
  const valClass = i.tipo==='entrada' ? 'entrada' : (i.status==='pago' ? 'pago-ok' : 'saida');
  const obsHtml  = i.obs
    ? `<span class="obs-text">💬 ${escHtml(i.obs)}</span>`
    : `<span class="obs-empty">Sem observação</span>`;
  return `
    <div class="iitem" id="row-${i.id}">
      <div class="iitem-main">
        <div class="iitem-left">
          <div class="dot ${i.status}"></div>
          <div style="min-width:0">
            <div class="iname">${escHtml(i.desc)}</div>
            <div class="itag">${i.status}</div>
          </div>
        </div>
        <div class="iitem-right">
          <span class="ival ${valClass}">${fmt(i.valor)}</span>
          <div class="act-btns">
            <button class="act-btn" title="Ver obs" onclick="toggleObs(${i.id})">💬</button>
            <button class="act-btn edit" title="Editar" onclick="openEdit(${i.id})">✏️</button>
            <button class="act-btn copy" title="Copiar para outro mês" onclick="openCopy(${i.id})">📋</button>
            <button class="act-btn del" title="Remover" onclick="removeItem(${i.id})">✕</button>
          </div>
        </div>
      </div>
      <div class="obs-row" id="obs-${i.id}">${obsHtml}</div>
    </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════
//  OBS TOGGLE
// ══════════════════════════════════════════
function toggleObs(id) {
  const el = document.getElementById('obs-'+id);
  if (el) el.classList.toggle('open');
}

// ══════════════════════════════════════════
//  RENDER HISTÓRICO (lançamentos tab)
// ══════════════════════════════════════════
function renderHistorico() {
  const d  = monthData();
  const mn = MNAMES[currentMonth];
  document.getElementById('form-mes-label').textContent = mn;

  const todos = [...d.lote1,...d.lote2];
  const el = document.getElementById('historico-list');

  if (!todos.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div>Nenhum lançamento em ${mn}</div>`;
    return;
  }

  el.innerHTML = todos.slice().reverse().map(i => {
    const loteLabel = d.lote1.includes(i)?'Adiantamento':'Pagamento';
    const valClass  = i.tipo==='entrada'?'entrada':(i.status==='pago'?'pago-ok':'saida');
    const obsHtml   = i.obs ? `<span class="obs-text">💬 ${escHtml(i.obs)}</span>` : `<span class="obs-empty">Sem observação</span>`;
    return `
      <div class="iitem" id="hrow-${i.id}">
        <div class="iitem-main">
          <div class="iitem-left">
            <div class="dot ${i.status}"></div>
            <div style="min-width:0">
              <div class="iname">${escHtml(i.desc)}</div>
              <div class="itag">${i.tipo==='entrada'?'Receita':'Despesa'} · ${loteLabel}</div>
            </div>
          </div>
          <div class="iitem-right">
            <span class="ival ${valClass}">${fmt(i.valor)}</span>
            <div class="act-btns">
              <button class="act-btn" title="Ver obs" onclick="toggleObs2(${i.id})">💬</button>
              <button class="act-btn edit" title="Editar" onclick="openEdit(${i.id})">✏️</button>
              <button class="act-btn copy" title="Copiar" onclick="openCopy(${i.id})">📋</button>
              <button class="act-btn del" title="Remover" onclick="removeItem(${i.id})">✕</button>
            </div>
          </div>
        </div>
        <div class="obs-row" id="hobs-${i.id}">${obsHtml}</div>
      </div>`;
  }).join('');
}

function toggleObs2(id) {
  const el = document.getElementById('hobs-'+id);
  if (el) el.classList.toggle('open');
}

// ══════════════════════════════════════════
//  MODAL EDIT
// ══════════════════════════════════════════
function openEdit(id) {
  const item = findItem(id);
  if (!item) return;
  document.getElementById('edit-id').value    = id;
  document.getElementById('edit-tipo').value  = item.tipo;
  document.getElementById('edit-status').value= item.status;
  document.getElementById('edit-desc').value  = item.desc;
  document.getElementById('edit-valor').value = item.valor;
  document.getElementById('edit-obs').value   = item.obs||'';
  document.getElementById('modal-edit').classList.add('open');
}

function saveEdit() {
  const id     = +document.getElementById('edit-id').value;
  const tipo   = document.getElementById('edit-tipo').value;
  const status = document.getElementById('edit-status').value;
  const desc   = document.getElementById('edit-desc').value.trim();
  const valor  = parseFloat(document.getElementById('edit-valor').value);
  const obs    = document.getElementById('edit-obs').value.trim();

  if (!desc || isNaN(valor) || valor<=0) { toast('Preencha todos os campos ✗','#ef4444'); return; }

  const item = findItem(id);
  if (!item) return;
  item.tipo=tipo; item.status=status; item.desc=desc; item.valor=valor; item.obs=obs;

  closeModal('modal-edit');
  renderAll();
  toast('Editado com sucesso ✓');
}

// ══════════════════════════════════════════
//  MODAL COPY
// ══════════════════════════════════════════
let copySelectedMonth = null;

function openCopy(id) {
  const item = findItem(id);
  if (!item) return;
  copySelectedMonth = null;
  document.getElementById('copy-id').value       = id;
  document.getElementById('copy-desc').value     = item.desc;
  document.getElementById('copy-valor').value    = item.valor;
  document.getElementById('copy-status').value   = 'pendente';
  document.getElementById('copy-obs').value      = item.obs||'';

  // Build month picker — exclude current month
  document.getElementById('month-picker').innerHTML = MONTHS
    .filter(m=>m.key!==currentMonth)
    .map(m=>`<button class="mpick" id="mpick-${m.key}" onclick="pickMonth('${m.key}')">${m.label}</button>`).join('');

  document.getElementById('modal-copy').classList.add('open');
}

function pickMonth(key) {
  copySelectedMonth = key;
  document.querySelectorAll('.mpick').forEach(b=>b.classList.remove('picked'));
  const btn = document.getElementById('mpick-'+key);
  if (btn) btn.classList.add('picked');
}

function confirmCopy() {
  if (!copySelectedMonth) { toast('Selecione um mês destino ✗','#ef4444'); return; }
  const id    = +document.getElementById('copy-id').value;
  const lote  = document.getElementById('copy-lote').value;
  const desc  = document.getElementById('copy-desc').value.trim();
  const valor = parseFloat(document.getElementById('copy-valor').value);
  const status= document.getElementById('copy-status').value;
  const obs   = document.getElementById('copy-obs').value.trim();
  const item  = findItem(id);
  if (!item) return;

  if (!desc || isNaN(valor) || valor<=0) { toast('Preencha descrição e valor ✗','#ef4444'); return; }

  const copy = { ...item, id: nextId++, desc, valor, status, obs };
  const arr  = lote==='1' ? DB[copySelectedMonth].lote1 : DB[copySelectedMonth].lote2;
  arr.push(copy);

  closeModal('modal-copy');
  renderMonthTabs();
  toast(`Copiado para ${MNAMES[copySelectedMonth]} ✓`, '#f59e0b');
}

// ══════════════════════════════════════════
//  ADD ITEM
// ══════════════════════════════════════════
function addItem() {
  const tipo   = document.getElementById('f-tipo').value;
  const lote   = document.getElementById('f-lote').value;
  const desc   = document.getElementById('f-desc').value.trim();
  const valor  = parseFloat(document.getElementById('f-valor').value);
  const status = document.getElementById('f-status').value;
  const obs    = document.getElementById('f-obs').value.trim();

  if (!desc || isNaN(valor) || valor<=0) { toast('Preencha descrição e valor ✗','#ef4444'); return; }

  const item = {id:nextId++,tipo,desc,valor,status,obs};
  (lote==='1'?monthData().lote1:monthData().lote2).push(item);

  document.getElementById('f-desc').value='';
  document.getElementById('f-valor').value='';
  document.getElementById('f-obs').value='';

  renderAll();
  toast('Lançamento adicionado ✓');
}

// ══════════════════════════════════════════
//  REMOVE ITEM
// ══════════════════════════════════════════
function removeItem(id) {
  const d = monthData();
  ['lote1','lote2'].forEach(k=>{
    const idx=d[k].findIndex(i=>i.id===id);
    if(idx>-1) d[k].splice(idx,1);
  });
  renderAll();
  toast('Removido ✓');
}

// ══════════════════════════════════════════
//  RENDER GRÁFICO
// ══════════════════════════════════════════
function renderGrafico() {
  const d  = monthData();
  const mn = MNAMES[currentMonth];
  const l1 = calcLote(d.lote1);
  const l2 = calcLote(d.lote2);

  document.getElementById('chart-mes-label').textContent = mn+' 2026';

  const lotes = [{label:'Adian.',...l1},{label:'Pgto.',...l2}];
  const maxV  = Math.max(...lotes.map(l=>Math.max(l.entrada,l.saida)),1);
  document.getElementById('chart-bars').innerHTML = lotes.map(l=>{
    const hE=Math.round((l.entrada/maxV)*130);
    const hS=Math.round((l.saida/maxV)*130);
    return `<div class="bar-col">
      <div style="display:flex;align-items:flex-end;gap:3px;height:140px;width:100%">
        <div class="bar" style="background:var(--entrada);height:${hE}px;flex:1"></div>
        <div class="bar" style="background:var(--saida);height:${hS}px;flex:1"></div>
      </div>
      <div class="bar-lbl">${l.label}</div>
    </div>`;
  }).join('');

  const todos = [...d.lote1,...d.lote2].filter(i=>i.tipo==='saida').sort((a,b)=>b.valor-a.valor).slice(0,6);
  const maxD  = todos[0]?.valor||1;
  document.getElementById('top-list').innerHTML = todos.length
    ? todos.map(i=>`
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:4px">
            <span>${escHtml(i.desc)}</span><span style="color:var(--saida)">${fmt(i.valor)}</span>
          </div>
          <div class="prog-track"><div class="prog-fill d" style="width:${Math.round(i.valor/maxD*100)}%"></div></div>
        </div>`).join('')
    : `<div class="empty"><div class="empty-icon">📊</div>Sem despesas em ${mn}</div>`;
}

// ══════════════════════════════════════════
//  DATE EDIT
// ══════════════════════════════════════════
function openDateEdit(loteKey) {
  const loteLabel = loteKey==='lote1' ? 'Adiantamento' : 'Pagamento';
  const current   = LOTE_DATES[currentMonth][loteKey];
  document.getElementById('date-modal-title').textContent = `Data · ${loteLabel}`;
  document.getElementById('date-lote-key').value = loteKey;

  // Convert DD/MM/YYYY → YYYY-MM-DD for input[type=date]
  if (current) {
    const parts = current.split('/');
    if (parts.length===3) {
      document.getElementById('date-input').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
    } else {
      document.getElementById('date-input').value = '';
    }
    updateDatePreview(current);
  } else {
    document.getElementById('date-input').value = '';
    const prev = document.getElementById('date-preview');
    prev.style.display = 'none';
  }

  document.getElementById('modal-date').classList.add('open');
}

function updateDatePreview(formatted) {
  const prev = document.getElementById('date-preview');
  if (formatted) {
    prev.style.display = 'block';
    prev.innerHTML = `📅 Pagamento previsto para <strong style="color:var(--accent)">${formatted}</strong>`;
  } else {
    prev.style.display = 'none';
  }
}

document.addEventListener('change', e => {
  if (e.target.id === 'date-input') {
    const val = e.target.value;
    if (val) {
      const [y,m,d] = val.split('-');
      updateDatePreview(`${d}/${m}/${y}`);
    } else {
      updateDatePreview('');
    }
  }
});

function saveDate() {
  const loteKey = document.getElementById('date-lote-key').value;
  const raw     = document.getElementById('date-input').value;
  if (!raw) { toast('Selecione uma data ✗','#ef4444'); return; }
  const [y,m,d] = raw.split('-');
  LOTE_DATES[currentMonth][loteKey] = `${d}/${m}/${y}`;
  closeModal('modal-date');
  renderAll();
  toast('Data salva ✓');
}

function clearDate() {
  const loteKey = document.getElementById('date-lote-key').value;
  LOTE_DATES[currentMonth][loteKey] = '';
  closeModal('modal-date');
  renderAll();
  toast('Data removida');
}

// ══════════════════════════════════════════
//  MODAL CLOSE
// ══════════════════════════════════════════
function closeModal(id, e) {
  if (e && e.target !== document.getElementById(id)) return;
  document.getElementById(id).classList.remove('open');
}

// ══════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════
function switchMonth(key) {
  currentMonth = key;
  renderMonthTabs();
  renderAll();
  setTimeout(()=>{
    const a=document.querySelector('.mtab.active');
    if(a) a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  },50);
}

function switchInner(name, btn) {
  currentInner = name;
  document.querySelectorAll('.itab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.ipanel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('ipanel-'+name).classList.add('active');
  if(name==='grafico')     renderGrafico();
  if(name==='lancamentos') renderHistorico();
}

function renderAll() {
  renderResumo();
  if(currentInner==='lancamentos') renderHistorico();
  if(currentInner==='grafico')     renderGrafico();
  renderMonthTabs();
}

// ══════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════
let toastTimer;
function toast(msg, color='#6ee7b7') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.background=color;
  t.style.color=color==='#6ee7b7'?'#0e0f11':'#fff';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
(function(){
  const keys=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const real=keys[new Date().getMonth()];
  currentMonth=hasData(real)?real:'jun';
  renderMonthTabs();
  renderResumo();
})();
</script>
</body>
</html>
